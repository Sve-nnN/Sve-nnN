name: Snake

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v7.0.1

      - name: Create the assets directory
        run: mkdir -p assets

      - name: Generate the snake images
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=#0072d5
            assets/snake-dark.svg?palette=github-dark&color_snake=#0f92f7

      - name: Stop the animation for visitors who ask for reduced motion
        run: |
          for f in assets/snake-light.svg assets/snake-dark.svg; do
            sed 's|</svg>|<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style></svg>|' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh contribution snake"
          git pull --rebase
          git push
